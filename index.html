            const map = { 'engine': '🔧 Mesin', 'chassis': '🛞 Sasis', 'electrical': '⚡ Kelistrikan', 'ac': '❄️ AC' };

            const cards = items.map(h => {
                const done = state.foundIds.includes(h.id);
                let cls = 'hotspot';
                if (done) cls += h.isClue ? ' hotspot-found' : ' hotspot-normal';
                else if (h.tool) cls += ' hotspot-needstool';
                const toolTag = h.tool && !done ? `<span class="sub-label">🔧 ${toolName(h.tool)}</span>` : '';
                return `<div class="${cls}" onclick="inspect('${areaKey}','${h.id}')">
                <span class="emoji-big">${h.emoji}</span>
                <span class="label">${h.label}</span>
                <span class="sub-label">${done ? (h.isClue ? '✅ Petunjuk!' : '➖ Normal') : 'Klik periksa'}</span>
                ${toolTag}
            </div>`;

            return `<div class="scene-box"><h3 style="color:#fff; margin:4px;">${icon} ${title}</h3>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px;">${cards}</div>

        function renderScene() {
            const container = document.getElementById('scene-content');
            const scene = scenes[state.currentScene];
            container.innerHTML = scene ? scene.render() : `<p style="color:red;">Error</p>`;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                const sn = btn.dataset.scene;
                if (sn === 'menu' || sn === 'panduan' || sn === 'ruang_tamu') btn.classList.remove('locked');
                else if (['kap_mesin', 'kolom', 'kabin'].includes(sn)) {
                    const hasItems = state.activeCase && (state.activeCase.areas[sn] || []).length > 0;
                    btn.classList.toggle('locked', !state.hasMetCustomer || !hasItems);
                } else if (sn === 'hasil') btn.classList.toggle('locked', !state.hasMetCustomer || state.gameWon || state
                    .gameOver);
            });

            updateInventoryUI();
            const req = requiredClueIds();
            document.getElementById('clue-counter').textContent = state.foundClueIds.length;
            document.getElementById('clue-total').textContent = req.length;
            document.getElementById('score-counter').textContent = state.score;
            document.getElementById('hint-counter').textContent = state.hintsLeft;
            document.getElementById('hint-btn').classList.toggle('disabled', state.hintsLeft <= 0 || !state.hasMetCustomer);

            const pct = req.length ? Math.round((state.foundClueIds.length / req.length) * 100) : 0;
            document.getElementById('progress-bar-fill').style.width = pct + '%';

            document.querySelectorAll('.tool-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tool === state.selectedTool);
            });
        }

        function navigateTo(scene) {
            state.currentScene = scene;
            renderScene();
            if (scenes[scene]) showMessage(`📍 ${scenes[scene].title}`, '');
        }

        function inspect(areaKey, hotspotId) {
            if (state.gameWon || state.gameOver) return;
            const h = state.activeCase.areas[areaKey].find(x => x.id === hotspotId);
            if (!h) return;
            if (state.foundIds.includes(h.id)) { showMessage(`⚠️ ${h.label} sudah diperiksa.`, ''); return; }
            if (h.tool && state.selectedTool !== h.tool) {
                state.score = Math.max(0, state.score - 2);
                showMessage(`❌ Butuh ${toolName(h.tool)} untuk memeriksa ${h.label}!`, 'error');
                renderScene();
                return;
            }
            state.foundIds.push(h.id);
            if (h.isClue) {
                state.foundClueIds.push(h.id);
                state.inventory.push(`${h.emoji} ${h.label}: petunjuk`);
                state.score += 15;
                showMessage(`🔍 ${h.label}: ${h.find}`, 'success');
                if (state.foundClueIds.length === requiredClueIds().length) {
                    setTimeout(() => showMessage('🎯 Semua bukti terkumpul! Buka menu Diagnosa.', 'hint'), 600);
                }
            } else {
                state.score += 3;
                showMessage(`🔎 ${h.label}: ${h.find}`, '');
            }
            renderScene();
            if (h.explain) showExplain(h.explain);
        }

        function showExplain(text) {
            const container = document.getElementById('scene-content');
            const old = document.getElementById('explain-box');
            if (old) old.remove();
            const box = document.createElement('div');
            box.id = 'explain-box';
            box.textContent = '📘 ' + text;
            container.appendChild(box);
        }

            renderScene(); }

        function submitDiagnosis() {
            if (state.gameWon || state.gameOver) return;
            const req = requiredClueIds();
            const have = req.filter(id => state.foundClueIds.includes(id));
            if (have.length < req.length) { showMessage('⚠️ Kumpulkan semua bukti dulu!', 'error'); return; }
            if (!state.diagSelected) { showMessage('⚠️ Pilih diagnosa.', 'error'); return; }
            const c = state.activeCase;
            const opt = c.options.find(o => o.id === state.diagSelected);
            const correct = state.diagSelected === c.correct;
            if (correct) { state.score += 30;
                state.gameWon = true;
                state.gameOver = false; } else { state.score = Math.max(0, state.score - 20);
                state.gameOver = true;
                state.gameWon = false; }
            state.diagResult = { correct, feedback: opt.feedback };
            renderScene();
        }

        function retryDiagnosis() { state.gameOver = false;
            state.gameWon = false;
            state.diagSelected = null;
            state.diagResult = null;
            renderScene();
            showMessage('🔁 Coba diagnosa ulang.', ''); }

        function useHint() {
            if (state.hintsLeft <= 0 || !state.hasMetCustomer || state.gameWon || state.gameOver) return;
            const req = requiredClueIds();
            const missing = req.filter(id => !state.foundClueIds.includes(id));
            if (missing.length === 0) { showMessage('💡 Semua bukti sudah ditemukan!', 'hint'); return; }
            const areaNames = { kap_mesin: 'Kap Mesin', kolom: 'Kolom', kabin: 'Kabin' };
            let foundArea = null,
                foundTool = null;
            for (const [areaKey, items] of Object.entries(state.activeCase.areas)) {
                const hit = items.find(h => missing.includes(h.id));
                if (hit) { foundArea = areaKey;
                    foundTool = hit.tool; break; }
            }
            state.hintsLeft -= 1;
            state.score = Math.max(0, state.score - 5);
            const toolHint = foundTool ? ` Gunakan ${toolName(foundTool)}.` : '';
            showMessage(`💡 Cek area ${areaNames[foundArea]}${toolHint}`, 'hint');
            renderScene();
        }

        function meetCustomer() {
            state.hasMetCustomer = true;
            showMessage('📋 Kasus diterima! Cari bukti di area yang tersedia.', 'success');
            renderScene();
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (['kap_mesin', 'kolom', 'kabin'].includes(btn.dataset.scene)) {
                    const hasItems = state.activeCase && (state.activeCase.areas[btn.dataset.scene] || []).length > 0;
                    if (hasItems) btn.classList.remove('locked');
                }
            });
        }

        function startNewCase() {
            state.activeCase = pickCase();
            state.inventory = [];
            state.foundIds = [];
            state.foundClueIds = [];
            state.selectedTool = 'none';
            state.gameWon = false;
            state.gameOver = false;
            state.hasMetCustomer = false;
            state.score = 0;
            state.hintsLeft = 3;
            state.diagSelected = null;
            state.diagResult = null;
            state.currentScene = 'ruang_tamu';
            renderScene();
            document.querySelectorAll('.tool-item').forEach(el => el.classList.remove('active'));
            document.querySelector('[data-tool="none"]').classList.add('active');
            showMessage(`🆕 Kasus #${CASE_DB.indexOf(state.activeCase)+1}: ${state.activeCase.title}`, '');
        }

        document.querySelectorAll('.tool-item').forEach(el => {
            el.addEventListener('click', function() {
                state.selectedTool = this.dataset.tool;
                showMessage(`🛠️ ${this.textContent.trim()}`, '');
                renderScene();
            });
        });

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.classList.contains('locked')) return;
                navigateTo(this.dataset.scene);
            });
        });

        function updateInventoryUI() {
            const list = document.getElementById('inventory-list');
            if (state.inventory.length === 0) { list.innerHTML = '<span class="inv-empty">(kosong)</span>'; return; }
            list.innerHTML = state.inventory.map(item => `<span class="inv-slot">🧾 ${item}</span>`).join(' ');
        }

        function showMessage(text, type = '') {
            const box = document.getElementById('message-box');
            box.textContent = text;
            box.className = type;
        }

        // ================================================================
        //  INIT
        // ================================================================
        renderScene();
        document.querySelector('[data-tool="none"]').classList.add('active');
        showMessage('👋 Selamat datang! Klik "Kasus Baru" atau "Panduan Bermain".', '');
    </script>
</body>
</html>
